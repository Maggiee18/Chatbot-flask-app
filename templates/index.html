<!DOCTYPE html>
<html>
<head>
  <title>Gemini Flash Chatbot</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0;
      padding: 20px;
      background: #f0f2f5;
      min-height: 100vh;
    }
    .chat-box { 
      max-width: 800px; 
      margin: auto; 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .bubble { 
      margin: 10px 0; 
      padding: 12px 16px; 
      border-radius: 12px; 
      max-width: 80%;
      word-wrap: break-word;
    }
    .user { 
      background: #0084ff; 
      color: white;
      margin-left: auto;
    }
    .bot { 
      background: #f0f0f0; 
      color: #333;
    }
    #messages { 
      display: flex; 
      flex-direction: column; 
      gap: 8px;
      margin: 20px 0;
      max-height: 60vh;
      overflow-y: auto;
      padding: 10px;
    }
    .input-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    input { 
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }
    input:focus {
      border-color: #0084ff;
    }
    button { 
      padding: 12px 24px;
      font-size: 16px;
      background: #0084ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0073e6;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    h2 {
      color: #333;
      margin: 0 0 20px 0;
    }
    .typing-indicator {
      display: none;
      color: #666;
      font-style: italic;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <h2>🤖 Gemini Flash Chatbot</h2>
    <div id="messages"></div>
    <div id="typing" class="typing-indicator">Bot is typing...</div>
    <div class="input-container">
      <input type="text" id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()" id="sendButton">Send</button>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const typingIndicator = document.getElementById("typing");

    function appendMessage(text, sender, timestamp = null) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + sender;
      
      const messageContent = document.createElement("div");
      messageContent.innerText = text;
      bubble.appendChild(messageContent);
      
      if (timestamp) {
        const timeDiv = document.createElement("div");
        timeDiv.className = "message-time";
        timeDiv.style.fontSize = "0.8em";
        timeDiv.style.color = "#666";
        timeDiv.style.marginTop = "4px";
        timeDiv.innerText = timestamp;
        bubble.appendChild(timeDiv);
      }
      
      messagesDiv.appendChild(bubble);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      // Disable input and button while processing
      userInput.disabled = true;
      sendButton.disabled = true;
      typingIndicator.style.display = "block";

      appendMessage(message, "user");
      userInput.value = "";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message })
        });
        
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.reply || "Error occurred");
        }
        appendMessage(data.reply, "bot", data.timestamp);
      } catch (error) {
        appendMessage("❌ " + error.message, "bot");
      } finally {
        // Re-enable input and button
        userInput.disabled = false;
        sendButton.disabled = false;
        typingIndicator.style.display = "none";
        userInput.focus();
      }
    }
  </script>
</body>
</html>
